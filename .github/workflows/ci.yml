name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SX_API_SERVER_KEY: ci-build-only-key
      SX_PUBLIC_URL: http://localhost:3000
      ADMIN_EMAILS: ci-admin@example.com
      NEXT_PUBLIC_ENABLE_DEV_BYPASS: "false"
      SX_ENABLE_DEV_BYPASS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
